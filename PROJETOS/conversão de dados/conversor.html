<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de dados</title>
    <link rel="stylesheet" href="conversor.css">
</head>
<body>
    <div class="pai">
    
        <h1 id="titulo">Vamos converter seus dados</h1><br>
    

    <div class="bloco">
        <p>conversor de graus Celsius para Fahrenheint ou vice e versa</p><br>
        <input type="text" id="graus">

        <button onclick="celcius()">Celcius</button>
        <button onclick="fah()">Fahrenheint</button>
    </div><br>

    <div class="bloco">
        <p>conversor de valor de moeda real para...</p><br>
        <input type="text" id="moeda">

        <button onclick="dolar()">dolar</button>
        <button onclick="euro()">euro</button>
        <button onclick="baht()">baht</button>
    </div>
</div>
    <script src="conversor.js"></script>
</body>
</html>
