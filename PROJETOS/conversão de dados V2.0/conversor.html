<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de dados by Elo</title>
    <link rel="stylesheet" href="conversor.css">
</head>
<body>
    <div class="pai">
    
        <h1 id="titulo">Vamos converter seus dados</h1><br>
    

    <div class="bloco">
        <p>conversor de graus Celsius para Fahrenheint ou vice e versa</p><br>
        <input type="text" id="graus">
            <select name="temperatura" id="param1">
                <option value="celcius">celcius</option>
                <option value="fah">Fahrenheint</option>
            </select>

            <button onclick="temp()">converter</button>
    </div>

    <div class="bloco">
        <p>conversor de valor de moeda real para...</p><br>
        <input type="text" id="moeda">

        <select name="moeda" id="param2">
            <option value="dolar">dolar</option>
            <option value="euro">euro</option>
            <option value="baht">baht</option>
        </select>
        
        <button onclick="moeda()">converter</button>
    </div>
</div>
    <script src="conversor.js"></script>
</body>
</html>
